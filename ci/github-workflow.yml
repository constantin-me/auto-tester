# Auto-tester for pull requests — TEMPLATE.
#
# Copy to `.github/workflows/autotester.yml` in the APP's repository (not this one).
# Advisory: the job reports, it never blocks a merge (the check step always succeeds).
#
# STATUS: never run on GitHub. Every step was rehearsed locally with ci/rehearse.sh
# (same sequence, on a clone of the app): see ci/README.md.
#
# The app repo commits: autotester.config.json (qa.disposable + qa.seed), the fixture it
# seeds, and the enriched mind-map (store.dir). Enrichment runs on a developer machine,
# never here; a re-crawl in CI keeps it.
#
# Decisions before enabling (see ci/README.md):
#   - which repository this goes in
#   - whether reports are posted as PR comments (off by default)
#
# Secrets used:
#   TYPESAFE_API_KEY    Jev judgments
# (the test login comes from the committed fixture: public on purpose, no secret needed)

name: autotester (advisory)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  # pull-requests: write   # only if you enable the comment step below

concurrency:
  group: autotester-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      # must match store.dir in autotester.config.json (relative to the repo root)
      STORE_DIR: .autotester/mindmap
    steps:
      - name: Check out the app (full history, for base..head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out auto-tester
        uses: actions/checkout@v4
        with:
          repository: constantin-me/auto-tester   # adjust if you fork or move it
          path: .autotester-tool

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .autotester-tool/package-lock.json

      - name: Install auto-tester
        working-directory: .autotester-tool
        run: npm ci

      # same change, same question -> same Jev answer: re-runs and unchanged pages are free
      - uses: actions/cache@v4
        with:
          path: .autotester/cache
          key: autotester-jev-${{ github.run_id }}
          restore-keys: autotester-jev-

      # APP: DVinyl reads .env (not committed) and refuses empty or published secrets
      - name: Write the app's .env with fresh secrets
        run: |
          {
            echo "MONGODB_URL=mongodb://mongodb:27017/dvinyl"
            echo "PASSJWT=$(openssl rand -hex 32)"
            echo "SESSION_SECRET=$(openssl rand -hex 32)"
            echo "PROD=false"
            echo "VINYL_PORT=3099"
            echo "BASE_URL="
          } > "$RUNNER_TEMP/app.env"

      # ---- baseline on the PR's base ------------------------------------------------
      - name: Start the app at the base commit
        run: |
          git checkout --quiet "$BASE_SHA"
          cp "$RUNNER_TEMP/app.env" .env
          docker compose up -d --build
          curl -s -o /dev/null --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:3099/login

      - name: Seed the test user and data from the committed fixture
        working-directory: .autotester-tool
        run: npm run qa:seed -- "$GITHUB_WORKSPACE/autotester.config.json"

      - name: Record the baseline
        working-directory: .autotester-tool
        run: |
          npm run bootstrap -- "$GITHUB_WORKSPACE/autotester.config.json"
          npm run qa:baseline -- "$GITHUB_WORKSPACE/autotester.config.json"

      # ---- check the PR's head against it ------------------------------------------
      - name: Rebuild the app at the head commit
        run: |
          # the baseline rewrote the committed mind-map; keep it across the checkout
          # (a PR that changes that file would otherwise make the checkout fail)
          cp -r "$STORE_DIR" "$RUNNER_TEMP/mindmap-baseline"
          git checkout --quiet --force "$HEAD_SHA"
          rm -rf "$STORE_DIR" && mkdir -p "$(dirname "$STORE_DIR")" && cp -r "$RUNNER_TEMP/mindmap-baseline" "$STORE_DIR"
          cp "$RUNNER_TEMP/app.env" .env
          docker compose up -d --build
          curl -s -o /dev/null --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors http://localhost:3099/login

      - name: Check the change (advisory, never fails the job)
        working-directory: .autotester-tool
        run: npm run qa:check -- "$GITHUB_WORKSPACE/autotester.config.json" "$BASE_SHA..$HEAD_SHA" || true

      - name: Upload the report and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotester-report
          path: .autotester/runs/
          if-no-files-found: warn

      # ---- optional: post the report on the PR (off by default) ----------------------
      # - name: Comment the report on the PR
      #   if: always()
      #   env:
      #     GH_TOKEN: ${{ github.token }}
      #   run: |
      #     report=$(ls -td .autotester/runs/check-*/ | head -1)report.md
      #     gh pr comment ${{ github.event.pull_request.number }} --body-file "$report"
